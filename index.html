<!doctype html>
<html lang="he" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1662F5">
<title>אחות בדרך</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* --- Leaflet 1.9.4 core styles (inlined) --- */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;outline-offset:1px;font-size:12px}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.leaflet-container .leaflet-tile-pane img,.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-tile{filter:inherit;visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-box{width:0;height:0;box-sizing:border-box;z-index:800}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right}.leaflet-bottom .leaflet-control{margin-bottom:0}.leaflet-left .leaflet-control{margin-left:0}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.leaflet-bottom{bottom:var(--sheet-h,0px)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 80%,transparent);padding:0 6px;color:var(--muted);font-size:10px;direction:ltr}
.leaflet-control-attribution a{color:inherit}

/* --- Tokens --- */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --surface-2:#F4F7FC; --ink:#14213D; --muted:#5E6B85; --line:#E3E8F2;
  --brand:#1662F5; --brand-ink:#FFFFFF; --brand-soft:#E7EEFF; --brand-2:#0B4FD6;
  --ok:#12A150; --ok-soft:#E2F6E9; --amber:#E08A00; --amber-soft:#FFF3DC; --danger:#E5484D; --danger-soft:#FDECEC;
  --map-land:#F1F3EE; --map-street:#FFFFFF; --map-main:#FFD98A; --map-sea:#A9D8F2; --map-park:#C6EAB9; --map-bldg:#E4E6E1; --map-sand:#F6EACB;
  --shadow:0 12px 32px rgba(20,33,61,.14),0 2px 6px rgba(20,33,61,.06);
  --shadow-sm:0 2px 8px rgba(20,33,61,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0C1220; --surface:#151D2E; --surface-2:#1C2638; --ink:#EAF0FA; --muted:#9AA7BE; --line:#2A3548;
  --brand:#5B93FF; --brand-ink:#0A1022; --brand-soft:#1B2B4D; --brand-2:#7FAAFF;
  --ok:#3DD68C; --ok-soft:#173424; --amber:#FBBF24; --amber-soft:#3A2E12; --danger:#FF6B6F; --danger-soft:#3A1C20;
  --map-land:#141B26; --map-street:#243044; --map-main:#4B4430; --map-sea:#0F2338; --map-park:#17301F; --map-bldg:#1B2331; --map-sand:#2A2A20;
  --shadow:0 12px 32px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3); --shadow-sm:0 2px 8px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1220; --surface:#151D2E; --surface-2:#1C2638; --ink:#EAF0FA; --muted:#9AA7BE; --line:#2A3548;
  --brand:#5B93FF; --brand-ink:#0A1022; --brand-soft:#1B2B4D; --brand-2:#7FAAFF;
  --ok:#3DD68C; --ok-soft:#173424; --amber:#FBBF24; --amber-soft:#3A2E12; --danger:#FF6B6F; --danger-soft:#3A1C20;
  --map-land:#141B26; --map-street:#243044; --map-main:#4B4430; --map-sea:#0F2338; --map-park:#17301F; --map-bldg:#1B2331; --map-sand:#2A2A20;
  --shadow:0 12px 32px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3); --shadow-sm:0 2px 8px rgba(0,0,0,.35);
}

[hidden]{display:none!important}
html,body{height:100%;margin:0;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"Rubik","Assistant","Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px}

#app{position:relative;height:100%;height:100dvh;overflow:hidden}
#map{position:absolute;inset:0;background:var(--map-land)}

/* top bar */
.topbar{position:absolute;top:12px;inset-inline:12px;z-index:1100;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:6px 16px 6px 6px;box-shadow:var(--shadow)}
.brand-mark{width:34px;height:34px;border-radius:50%;background:var(--brand);display:grid;place-items:center;color:var(--brand-ink);box-shadow:0 4px 10px color-mix(in srgb,var(--brand) 40%,transparent)}
.brand b{font-weight:700;font-size:16px}
.brand small{display:block;color:var(--muted);font-size:11px;margin-top:-2px}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:500;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);font-weight:700}

.map-ctrls{position:absolute;bottom:calc(var(--sheet-h,0px) + 12px);inset-inline-end:12px;z-index:1050;display:flex;flex-direction:column;gap:8px}
.map-ctrls button{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center;color:var(--ink)}

.navbar{position:absolute;top:68px;inset-inline:12px;z-index:1060;background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:520px}
.navbar .arrow{width:44px;height:44px;border-radius:14px;background:color-mix(in srgb,var(--brand-ink) 18%,transparent);display:grid;place-items:center;flex:none}
.navbar b{font-size:22px;display:block;line-height:1.1}
.navbar span{font-size:14px;opacity:.92}

#centerPin{position:absolute;z-index:1040;transform:translate(-50%,-100%);pointer-events:none;transition:transform .15s}
#centerPin.lift{transform:translate(-50%,-114%)}
#centerPin .pt{margin-bottom:7px}
#centerPin .lbl{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:8px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:500;border-radius:999px;padding:5px 11px;white-space:nowrap;box-shadow:var(--shadow-sm)}

/* sheet */
.sheet{position:absolute;z-index:1080;inset-inline:0;bottom:0;max-height:64%;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;box-shadow:var(--shadow);padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
@media (min-width:860px){
  .sheet{top:80px;bottom:auto;inset-inline-start:16px;inset-inline-end:auto;width:420px;max-height:calc(100% - 96px);border-radius:26px;padding:22px}
  .sheet::before{display:none}
  .navbar{inset-inline-start:456px}
}
.stack{display:flex;flex-direction:column;gap:16px}
.h1{font-weight:700;font-size:22px;line-height:1.2;margin:0;text-wrap:balance}
.h2{font-weight:600;font-size:16px;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.3px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.hr{height:1px;background:var(--line);border:0;margin:0}

.greet{display:flex;flex-direction:column;gap:2px}
.greet .eyebrow{color:var(--brand);font-size:13px}
.trust{display:flex;gap:6px;flex-wrap:wrap}
.trust span{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.trust svg{color:var(--c,var(--brand))}

.addr{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:18px;padding:12px 14px}
.addr .dot{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.addr b{display:block;font-weight:600}
.addr span{font-size:12px;color:var(--muted)}

.svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc{--c:var(--brand);display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:start;border:1.5px solid var(--line);background:var(--surface);border-radius:20px;padding:14px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.svc:hover{border-color:var(--c);box-shadow:var(--shadow-sm);transform:translateY(-2px)}
.svc:active{transform:scale(.98)}
.ic{--c:var(--brand);width:46px;height:46px;border-radius:15px;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c);display:grid;place-items:center;flex:none}
.ic.lg{width:60px;height:60px;border-radius:19px}
.svc b{font-weight:600;font-size:14.5px;line-height:1.25}
.svc .meta{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:12px;color:var(--muted);margin-top:auto}
.svc .price{font-weight:700;font-size:15px;color:var(--ink)}

.live{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink);background:var(--ok-soft);border-radius:14px;padding:10px 12px}
.live i{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}

.back{border:0;background:var(--surface-2);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 14px;cursor:pointer;font-weight:500;font-size:14px;text-align:start}
.chip small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--ink);font-weight:600}
.incl{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px}
.incl li{display:flex;gap:10px;align-items:flex-start}
.incl svg{color:var(--ok);flex:none;margin-top:3px}
textarea{width:100%;min-height:64px;resize:vertical;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:14px;padding:10px 12px;font:inherit;font-size:14px}
.sum{display:grid;gap:7px;font-size:14px;background:var(--surface-2);border-radius:18px;padding:14px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum .tot{font-weight:700;font-size:17px;padding-top:8px;border-top:1.5px dashed var(--line)}
.sum .save{color:var(--ok);font-weight:500}

.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border:0;border-radius:18px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 8px 20px color-mix(in srgb,var(--brand) 35%,transparent);transition:transform .1s,background .15s}
.cta:hover{background:var(--brand-2)}
.cta:active{transform:scale(.98)}
.cta:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:48px;padding:0 14px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;font-weight:500;font-size:14px;flex:1}
.btn:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger);border-color:transparent;background:var(--danger-soft)}
.btns{display:flex;gap:8px}
.stack>.btn{flex:none}

/* searching */
.radar{position:relative;height:110px;display:grid;place-items:center}
.radar span{position:absolute;width:48px;height:48px;border-radius:50%;background:color-mix(in srgb,var(--c,var(--brand)) 25%,transparent);opacity:0;animation:radar 2.4s infinite}
.radar span:nth-child(2){animation-delay:.8s}.radar span:nth-child(3){animation-delay:1.6s}
.radar .core{position:relative;width:56px;height:56px;border-radius:50%;background:var(--c,var(--brand));color:#fff;display:grid;place-items:center;opacity:1;animation:none;box-shadow:0 8px 18px color-mix(in srgb,var(--c,var(--brand)) 40%,transparent)}
@keyframes radar{0%{transform:scale(.8);opacity:.9}100%{transform:scale(2.8);opacity:0}}
.reqs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.reqs li{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);border-radius:16px}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--surface);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--danger-soft);color:var(--danger)}
.pill.see{background:var(--amber-soft);color:var(--amber)}
.pill.blue{background:var(--brand-soft);color:var(--brand)}

.av{--c:var(--brand);width:42px;height:42px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.av.lg{width:62px;height:62px;font-size:21px;box-shadow:0 0 0 4px var(--surface),0 0 0 6px color-mix(in srgb,var(--c) 35%,transparent)}
.grow{flex:1;min-width:0}
.star{color:var(--amber)}

.eta{display:flex;align-items:baseline;gap:8px}
.eta b{font-size:40px;line-height:1;font-weight:700;color:var(--brand)}
.ncard{display:flex;gap:14px;align-items:center;padding:14px;border-radius:20px;background:var(--surface-2)}
.ncard .name{font-weight:700;font-size:17px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:999px;padding:4px 10px;color:var(--ink);background:var(--surface-2)}
.tag.v{color:var(--ok);background:var(--ok-soft);font-weight:600}
.plate{font-weight:700;background:#FFD43B;color:#1b1b1b;border-radius:6px;padding:1px 7px;font-size:13px;direction:ltr;display:inline-block;border:1.5px solid #1b1b1b}

.tl{list-style:none;margin:0;padding:0;display:grid}
.tl li{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--muted);position:relative;padding:6px 0}
.tl li i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--line);background:var(--surface);flex:none;position:relative;z-index:1}
.tl li:not(:last-child)::after{content:"";position:absolute;inset-inline-start:6px;top:22px;height:16px;width:2.5px;background:var(--line)}
.tl li.done{color:var(--ink)}.tl li.done i{background:var(--ok);border-color:var(--ok)}
.tl li.now{color:var(--ink);font-weight:600}.tl li.now i{border-color:var(--brand);box-shadow:0 0 0 5px var(--brand-soft)}

.bar{height:10px;border-radius:10px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--ok));border-radius:10px;transition:width .6s}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checks li,.checks button{display:flex;gap:12px;align-items:center;font-size:14.5px;width:100%;text-align:start;padding:10px 12px;border-radius:16px;background:var(--surface-2);border:0}
.checks button{cursor:pointer}
.box{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;background:var(--surface)}
.checks .on .box{background:var(--ok);border-color:var(--ok);color:#fff}
.checks .wait{color:var(--muted)}
.checks .cur{background:var(--brand-soft);font-weight:600}
.checks .cur .box{border-color:var(--brand)}

.stars{display:flex;gap:6px;justify-content:center}
.stars button{border:0;background:none;cursor:pointer;padding:2px;color:var(--line);transition:transform .1s}
.stars button:hover{transform:scale(1.12)}
.stars button.on{color:var(--amber)}
.receipt{background:var(--surface-2);border-radius:18px;padding:14px;display:grid;gap:7px;font-size:14px}
.receipt div{display:flex;justify-content:space-between;gap:10px}
.done-badge{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 8px;box-shadow:0 0 0 8px var(--ok-soft)}

/* chat */
.chatlog{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto;padding:4px 0}
.msg{max-width:80%;padding:9px 13px;border-radius:18px;font-size:14px}
.msg.me{align-self:flex-start;background:var(--brand);color:var(--brand-ink);border-end-start-radius:5px}
.msg.them{align-self:flex-end;background:var(--surface-2);border-end-end-radius:5px}
.msg.typing{color:var(--muted);font-style:italic}
.chatform{display:flex;gap:8px}
.chatform input{flex:1;min-width:0;height:48px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface-2);color:var(--ink);padding:0 16px;font:inherit}
.chatform button{width:48px;height:48px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;cursor:pointer}

/* nurse mode */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{border-radius:16px;padding:12px;background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.kpi b{font-size:21px;display:block;color:var(--c)}
.kpi span{font-size:12px;color:var(--muted)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:18px;border:0;cursor:pointer;width:100%;background:var(--surface-2);text-align:start}
.switch[aria-checked="true"]{background:var(--ok-soft)}
.switch .tr{width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch .tr::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:inset-inline-start .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"] .tr{background:var(--ok)}
.switch[aria-checked="true"] .tr::after{inset-inline-start:25px}
.incoming{border-radius:22px;padding:16px;display:grid;gap:14px;background:var(--surface);box-shadow:0 0 0 2px var(--brand),var(--shadow-sm)}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.alert{background:var(--amber-soft);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:500}
.alert.bad{background:var(--danger-soft);color:var(--danger)}

/* markers */
.mk{background:none;border:0}
.nm{--c:var(--brand);width:30px;height:30px;border-radius:50%;background:var(--c);border:2.5px solid #fff;display:grid;place-items:center;font:700 10px "Rubik",sans-serif;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.3);transition:opacity .3s,transform .3s,filter .3s;position:relative}
.nm.dim{opacity:.35}
.nm.req::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--amber);animation:radar 1.6s infinite}
.nm.no{filter:grayscale(1);opacity:.5}
.nm.assigned{transform:scale(1.35);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 35%,transparent),0 4px 10px rgba(0,0,0,.3)}

        line({ u, v: Math.max(vmin, coast(u) + 60) }, { u, v: vmax });
      }
      for (let j = Math.floor(vmin / BV); j <= Math.ceil(vmax / BV); j++) {
        if (main !== (mod(j, 4) === 1)) continue;
        const v = j * BV; if (v < coast(0) + 40) continue;
        if (main) line({ u: umin, v }, { u: umax, v });
        else { if (umin < PARK[0]) line({ u: umin, v }, { u: Math.min(umax, PARK[0]), v }); if (umax > PARK[1]) line({ u: Math.max(umin, PARK[1]), v }, { u: umax, v }); }
      }
      ctx.strokeStyle = main ? C.main : C.street;
      ctx.lineWidth = main ? Math.max(15, 3 * mpp) : Math.max(7, 1.3 * mpp);
      ctx.stroke();
    };
    if (z >= 14) drawStreets(false);
    drawStreets(true);
    // sea on top
    if (vmin < coast(umin) + 80 || vmin < coast(umax) + 80) {
      const pts = []; for (let u = umin; u <= umax + 40; u += 40) pts.push({ u, v: coast(u) });
      pts.push({ u: umax + 40, v: vmin - 3000 }, { u: umin, v: vmin - 3000 }); poly(pts, C.sea);
    }
    return t;
  }
});

let last = performance.now();
function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  for (const n of nurses) {
    if (n.mode === 'wander' || n.mode === 'enroute') {
      n.path.d += n.speed * dt;
      n.pos = at(n.path, n.path.d);
      n.marker.setLatLng(uv2ll(n.pos));
      if (n.path.d >= n.path.total) { if (n.mode === 'wander') newWander(n); else { n.mode = 'hold'; n.onArrive?.(); } }
    }
  }
  if (me.mode === 'enroute') {
    me.path.d += me.speed * dt; me.pos = at(me.path, me.path.d); me.marker.setLatLng(uv2ll(me.pos));
    if (me.path.d >= me.path.total) { me.mode = 'hold'; me.onArrive?.(); }
  }
  requestAnimationFrame(tick);
}

      <ul class="tl">${steps.map((s, i) => `<li class="${i < idx ? 'done' : i === idx ? 'now' : ''}"><i></i>${s[1]}</li>`).join('')}</ul>

      ${ph === 'arrived' ? `<button class="cta" data-act="opened">פתחתי את הדלת</button>` : ''}
      <div class="btns"><button class="btn" data-act="call">${ico('phone', 18)} התקשרות</button>${ph === 'visit' || ph === 'arrived' ? '' : P.cancelAsk ? '' : `<button class="btn danger" data-act="cancelRide">ביטול</button>`}</div>
      ${P.cancelAsk ? (ph === 'assigned' || ph === 'called'
        ? `<div class="alert">${first(n)} עוד לא ${n.f ? 'יצאה' : 'יצא'} לדרך, אז הביטול בחינם.</div><div class="btns"><button class="btn danger" data-act="cancelYes">כן, לבטל</button><button class="btn" data-act="cancelNo">השארת ההזמנה</button></div>`
        : `<div class="alert bad">${first(n)} כבר בדרך. ביטול עכשיו כרוך בדמי יציאה של ₪60, שעוברים ${n.f ? 'לאחות' : 'לאח'}.</div><div class="btns"><button class="btn danger" data-act="cancelYes">כן, לבטל</button><button class="btn" data-act="cancelNo">השארת ההזמנה</button></div>`) : ''}
    </div>`;
  },
  done() {
    const s = P.svc, n = P.nurse;
    return `<div class="stack">
      <div style="text-align:center"><div class="done-badge">${ico('check', 32, 3)}</div><div class="eyebrow">הביקור הסתיים</div><h1 class="h1">איך היה עם ${first(n)}?</h1></div>
      <div class="stars">${[1, 2, 3, 4, 5].map(i => `<button data-act="star" data-v="${i}" class="${i <= P.rating ? 'on' : ''}" aria-label="${i} כוכבים">${ico('star', 34)}</button>`).join('')}</div>
      <div class="receipt num"><div class="eyebrow"><span>קבלה</span><span>${new Date().toLocaleDateString('he-IL')}</span></div>
        <div><span>ביקור אחות בית</span><span>${nis(s.price)}</span></div>
        <div style="font-weight:700"><span>חויב בכרטיס •••• 4417</span><span>${nis(s.price)}</span></div>
        <div class="muted small"><span>בקבלה ובהודעות לא מופיע סוג הטיפול</span><span>${P.invoice}</span></div>
      </div>
      <button class="btn" data-act="again" style="flex:none">לקבוע ביקור נוסף עם ${first(n)}</button>
      <div class="calm">${ico('phone', 16, 2.2)}<span>יש שאלה רפואית? פנו לרופא המטפל. במצב חירום חייגו 101.</span></div>
      <button class="cta" data-act="finish">שליחת דירוג</button>
    </div>`;
  },
};

function render() {
  if (MODE === 'nurse') return renderNurse();
  sheet.innerHTML = VIEW[P.step]();
}

function goHome() {
  clearTimers(); clearRoute();
  Object.assign(P, { step: 'home', svc: null, nurse: null, reqs: [], phase: '', cancelAsk: false, rating: 5, rx: false, type: 0 });
  for (const n of nurses) { if (n.mode !== 'wander' && n.mode !== 'off') newWander(n); nClass(n, ''); }
  render(); pinMode(true); placeAt(uv2ll(P.loc), 15.5);
  every(() => { const a = document.getElementById('availN'); if (a) a.textContent = available().length; }, 1500);
}

const ACT = {
  svc(id) { P.svc = svcById(id); P.type = 0; P.rx = false; P.step = 'details'; render(); sheet.scrollTop = 0; },
  back() { P.step = 'home'; render(); },
  toDetails() { P.step = 'details'; render(); },
  type(v) { P.type = +v; render(); },
  forWho(v) { P.forWho = v; render(); },
  auth() { P.auth = !P.auth; render(); },
  rx() { P.rx = !P.rx; render(); },
  when(v) { P.when = v; render(); },
  lift() { P.lift = !P.lift; render(); },
  pet() { P.pet = !P.pet; render(); },
  gender(v) { P.gender = v; render(); },
  lang(v) { P.lang = v; render(); },
  talk() { toast('אחות מהצוות תחזור אליכם בטלפון תוך כמה דקות (דמו)'); },
  order() { if (!canOrder()) return; P.step = 'verify'; render(); sheet.scrollTop = 0; },
  confirm() {
    pinMode(false); patientMarker.setLatLng(uv2ll(P.loc)).addTo(map);
    if (P.when !== 'asap') toast('בדמו מדלגים ישר למועד הביקור');
    startSearch();
  },
  cancelSearch() { toast('ההזמנה בוטלה. לא חויבתם.'); goHome(); },
  call() { toast('מתקשרים דרך המספר של השירות. המספרים האישיים מוסתרים בשני הצדדים (דמו).'); },
  cancelRide() { P.cancelAsk = true; render(); },
  cancelNo() { P.cancelAsk = false; render(); },
  cancelYes() { const free = P.phase === 'assigned' || P.phase === 'called'; toast(free ? 'הביקור בוטל, בלי חיוב' : 'הביקור בוטל. חויבו דמי יציאה ₪60'); goHome(); },
  opened() { startVisit(); },
  star(v) { P.rating = +v; render(); },
  again() { toast(`נשלחה בקשה ל${first(P.nurse)} לביקור הבא. ${P.nurse.f ? 'היא תקבל' : 'הוא יקבל'} אותה ראשון${P.nurse.f ? 'ה' : ''} (דמו)`); },
  finish() { toast(`תודה! הדירוג נשמר`); goHome(); },
  // nurse mode
  online() { N.online = !N.online; if (N.online) queueRequest(2500); else { clearTimers(); N.req = null; N.step = 'idle'; } renderNurse(); },
  accept() { acceptReq(); },
  decline() { declineReq('ההצעה הועברה לאחות אחרת'); },
  nCall() { N.called = true; toast('מתקשרת למשפחה דרך המספר של השירות (דמו)'); renderNurse(); },
  nGo() { startDrive(); },
  nArrived() { N.step = 'onsite'; N.ok = []; renderNurse(); },
  nOk(i) { i = +i; N.ok.includes(i) ? N.ok.splice(N.ok.indexOf(i), 1) : N.ok.push(i); renderNurse(); },
  nStart() { N.step = 'treating'; N.started = Date.now(); renderNurse(); },
  nFinish() { finishNurseVisit(); },
  nNext() { N.step = 'idle'; N.req = null; clearRoute(); map.removeLayer(N.pm); renderNurse(); queueRequest(4000); fit([uv2ll(me.pos)], 15.5); },
};
sheet.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; ACT[b.dataset.act]?.(b.dataset.v, b); });
sheet.addEventListener('input', e => { if (e.target.id === 'family') P.family = e.target.value.trim(); });

function startSearch() {
  P.step = 'searching'; P.phase = 'sent';
  // the 3 best-fit nurses, offered in parallel; the best match among those who accept wins, not the fastest
  const cands = available().sort((a, b) => score(b) - score(a)).slice(0, 3);
  P.reqs = cands.map(n => ({ n, s: 'sent' }));
  for (const n of nurses) { if (cands.includes(n)) { n.mode = 'hold'; nClass(n, 'req'); } else nClass(n, 'dim'); }
  render();
  fit([uv2ll(P.loc), ...cands.map(n => uv2ll(n.pos))], 16);
  const set = (k, s) => { const r = P.reqs[k]; if (!r) return; r.s = s; if (s === 'busy') nClass(r.n, 'no'); P.phase = 'wait'; render(); };
  later(() => set(2, 'ok'), 1300);
  later(() => set(1, 'busy'), 2000);
  later(() => set(0, 'ok'), 2600);
  later(() => { P.phase = 'pick'; render(); }, 3400);
  later(() => {
    const ok = P.reqs.filter(r => r.s === 'ok').map(r => r.n);
    const win = ok.sort((a, b) => score(b) - score(a))[0] || P.reqs[0].n;
    P.phase = 'done'; render();
    later(() => matched(win), 700);
  }, 4600);
}

function matched(n) {
  P.nurse = n; P.step = 'matched'; P.phase = 'assigned'; P.cancelAsk = false;
  for (const o of nurses) { if (o !== n) { if (o.mode === 'hold') newWander(o); nClass(o, 'dim'); } }
  nClass(n, 'assigned', n.f ? 'שובצה' : 'שובץ');
  render();
  fit([uv2ll(P.loc), uv2ll(n.pos)], 16);
  later(() => { toast(`שיחה נכנסת: ${first(n)} מ״אחות בדרך״`); }, 2200);
  later(() => { P.phase = 'called'; render(); }, 5200);
  later(() => depart(n), 7000);
}

function depart(n) {
  P.phase = 'enroute'; P.cancelAsk = false;
  n.path = mkPath(route(n.pos, P.loc)); n.speed = Math.max(n.path.total / 22, 12); n.mode = 'enroute';
  n.onArrive = arrived;
  drawRoute(n.path);
  nClass(n, 'assigned', 'בדרך');
  render();
  fit([uv2ll(P.loc), uv2ll(n.pos)], 16.5);
  every(() => {
    if (n.mode !== 'enroute') return;
    if (routeLine) routeLine.setLatLngs([uv2ll(n.pos), ...n.path.pts.slice(at(n.path, n.path.d).i).map(uv2ll)]);
  }, 400);
}

function arrived() {
  const n = P.nurse; P.phase = 'arrived'; P.cancelAsk = false;
  clearRoute();
  n.pos = { ...P.loc }; n.marker.setLatLng(uv2ll(P.loc));
  nClass(n, 'assigned', n.f ? 'הגיעה' : 'הגיע');
  render(); toast(`${first(n)} ${n.f ? 'הגיעה' : 'הגיע'}`);
}

function startVisit() {
  P.phase = 'visit'; render();
  nClass(P.nurse, 'assigned', 'בביקור');
  later(() => { P.invoice = 'קבלה ' + Math.floor(rnd(10000, 99999)); P.step = 'done'; render(); }, 4500);
}

const OFFER_SECS = 120;

function queueRequest(ms) {
  later(() => {
    if (MODE !== 'nurse' || !N.online || N.step !== 'idle') return;
    const svc = pick(SERVICES);
    let loc; do { loc = randLand(); } while (dist(loc, me.pos) < 500 || dist(loc, me.pos) > 1600);
    N.req = { svc, loc, area: pick(AREAS), pet: Math.random() < .4, lift: Math.random() < .6, net: svc.price - Math.round(svc.price * COMMISSION) };
    N.step = 'incoming'; N.left = OFFER_SECS; N.called = false;
    N.pm.setLatLng(uv2ll(loc)).addTo(map);
    fit([uv2ll(me.pos), uv2ll(loc)], 16);
    renderNurse();
    // demo runs the 2-minute window at 6x speed
    every(() => {
      if (N.step !== 'incoming') return;
      N.left -= .6;
      const c = document.getElementById('ringC'), n = document.getElementById('ringN');
      const L2 = Math.max(0, N.left);
      if (c) { c.setAttribute('stroke-dashoffset', 169.6 * (1 - L2 / OFFER_SECS)); n.textContent = Math.floor(L2 / 60) + ':' + String(Math.floor(L2 % 60)).padStart(2, '0'); }
      if (N.left <= 0) declineReq('ההצעה נסגרה');
    }, 100);
  }, ms);
}
function declineReq(msg) { clearTimers(); map.removeLayer(N.pm); N.req = null; N.step = 'idle'; toast(msg); renderNurse(); queueRequest(4500); }
function acceptReq() {
  clearTimers();
  toast('אישרת. בודקים מי עוד אישרה…');
  N.step = 'waiting';
  sheet.innerHTML = `<div class="stack" style="text-align:center"><div class="radar calm-radar"><span class="core">${ico('clock', 22)}</span></div><h1 class="h1">אישרת את ההצעה</h1><div class="muted small">ההחלטה מתקבלת תוך חצי דקה, לפי התאמה ולא לפי מהירות.</div></div>`;
  later(() => { toast('נבחרת! (ניסיון בטיפול הזה ומרחק)'); N.step = 'call'; renderNurse(); }, 2600);
}
function startDrive() {
  N.step = 'enroute';
  me.path = mkPath(route(me.pos, N.req.loc)); me.speed = Math.max(me.path.total / 26, 12); me.mode = 'enroute';
  me.onArrive = () => { toast('הגעת ליעד'); document.getElementById('navbar').hidden = true; const b = document.getElementById('nArrBtn'); if (b) b.disabled = false; };
  drawRoute(me.path); renderNurse();
  fit([uv2ll(me.pos), uv2ll(N.req.loc)], 16.5);
  every(updateNav, 300); updateNav();
}
function updateNav() {
  if (me.mode !== 'enroute') return;
  const p = me.path, cur = at(p, p.d), i = cur.i, toNext = p.cum[i] - p.d, rem = p.total - p.d;
  const e = document.getElementById('nEta'); if (e) e.textContent = etaMin(rem);
  if (routeLine) routeLine.setLatLngs([uv2ll(me.pos), ...p.pts.slice(i).map(uv2ll)]);
  const dEl = document.getElementById('navDist'), tEl = document.getElementById('navText'), aEl = document.getElementById('navArrow');
  if (i >= p.pts.length - 1) { dEl.textContent = fmtM(rem); tEl.textContent = 'היעד בצד ימין'; aEl.innerHTML = ico('flag', 24); return; }
  const a = uv2xy(p.pts[i - 1].u, p.pts[i - 1].v), b = uv2xy(p.pts[i].u, p.pts[i].v), c = uv2xy(p.pts[i + 1].u, p.pts[i + 1].v);
  const cross = (b.x - a.x) * (c.y - b.y) - (b.y - a.y) * (c.x - b.x);
  const nx = p.pts[i + 1], along = Math.abs(nx.u - p.pts[i].u) > Math.abs(nx.v - p.pts[i].v);
  const street = along ? nsName(p.pts[i].v) : ewName(p.pts[i].u);
  dEl.textContent = fmtM(toNext);
  tEl.textContent = `${cross > 0 ? 'פני שמאלה' : 'פני ימינה'} לרחוב ${street}`;
  aEl.innerHTML = ico(cross > 0 ? 'left' : 'right', 24);
}
function finishNurseVisit() {
  const r = N.req; N.earn += r.net; N.visits++; N.step = 'summary';
  renderNurse(); toast('הביקור הסתיים. המשפחה קיבלה קבלה.');
}
function recenter() {
  if (MODE === 'patient') {
    if (P.step === 'home' || P.step === 'details') placeAt(uv2ll(P.loc), 15.5);
    else if (P.nurse) fit([uv2ll(P.loc), uv2ll(P.nurse.pos)], 16.5);
    else fit([uv2ll(P.loc), ...P.reqs.map(r => uv2ll(r.n.pos))]);
  } else {
    fit(N.req ? [uv2ll(me.pos), uv2ll(N.req.loc)] : [uv2ll(me.pos)], 16);
  }
}
function setMode(m) {
  if (m === MODE) return;
  MODE = m; clearTimers(); clearRoute();
  document.getElementById('modeP').setAttribute('aria-pressed', m === 'patient');
  document.getElementById('modeN').setAttribute('aria-pressed', m === 'nurse');
  document.getElementById('navbar').hidden = true;
  if (m === 'nurse') {
    map.removeLayer(patientMarker); pinMode(false);
    for (const n of nurses) { if (n.mode !== 'wander') newWander(n); nClass(n, ''); }
    // "me" is Noa: hide her wandering twin
    map.removeLayer(nurses[0].marker); nurses[0].mode = 'off';
    me.marker.setLatLng(uv2ll(me.pos)).addTo(map);
    N.step = 'idle'; N.req = null; map.removeLayer(N.pm);
    renderNurse(); placeAt(uv2ll(me.pos), 15.5);
    if (N.online) queueRequest(2500);
  } else {
    me.mode = 'hold'; map.removeLayer(me.marker); map.removeLayer(N.pm);
    nurses[0].marker.addTo(map); newWander(nurses[0]);
    goHome();
  }
}
document.getElementById('modeP').onclick = () => setMode('patient');
document.getElementById('modeN').onclick = () => setMode('nurse');

goHome();
})();
</script>
